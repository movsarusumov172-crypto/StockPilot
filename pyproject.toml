[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "stockpilot"
version = "0.1.0"
description = "A small CLI for warehouse inventory and FIFO stock costing."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pandas>=2.2,<3.0",
    "pydantic>=2.9,<3.0",
    "sqlalchemy>=2.0,<3.0",
    "typer>=0.12,<1.0",
    "rich>=13.8,<16.0",
    "openpyxl>=3.1,<4.0",
    "python-dotenv>=1.0,<2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9.0", "ruff>=0.6,<1.0"]

[project.scripts]
stock = "stockpilot.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
